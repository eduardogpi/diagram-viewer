services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: workbench-web:local
    container_name: workbench-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/dev.db
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistência do SQLite (banco + WAL) — sobrevive a rebuilds do container
      - workbench-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  workbench-data:
    name: workbench-data
